[project]
name = "emporio-ai-agent"
version = "0.1.0"
description = "A grounded customer-service AI agent for Emporio da Musica"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pydantic>=2.7", "python-dotenv>=1.0", "requests>=2.32", "pypdf>=5.0", "streamlit>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
